name: Publish FileServer container

on:
  push:
    branches:
      - main

concurrency:
  group: publish-fileserver
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    #runs-on: ubuntu-latest
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test FileServer
        working-directory: FileServer
        run: ./gradlew build

      - name: Set image and application version
        id: metadata
        shell: bash
        run: |
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/fileserver" >> "$GITHUB_OUTPUT"
          echo "version=$(cat FileServer/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: FileServer/FileServer.Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
          tags: |
            ${{ steps.metadata.outputs.image }}:latest
            ${{ steps.metadata.outputs.image }}:${{ github.sha }}
