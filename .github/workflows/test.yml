name: Tests

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development
  merge_group:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secretservice:
    name: SecretService tests
    runs-on: self-hosted
    defaults:
      run:
        working-directory: SecretService
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: SecretService/go.mod
          cache-dependency-path: SecretService/go.sum
      - run: go test -race ./...
      - run: go vet ./...

  fileserver:
    name: FileServer tests
    #runs-on: ubuntu-latest
    runs-on: self-hosted
    defaults:
      run:
        working-directory: FileServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  portal:
    name: Portal tests
    #runs-on: ubuntu-latest
    runs-on: self-hosted
    defaults:
      run:
        working-directory: Portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Portal/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: npm test
