spring:

  main:
    web-application-type: reactive

  webflux:
    multipart:
      max-disk-usage-per-part: ${FILESERVER_MULTIPART_MAX_DISK_USAGE_PER_PART:100MB}

  application:
    name: FileServer

  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/dmp}
    representation:
      uuid: standard

  security:
    user:
      name: dev
      password: ${FILESERVER_PASSWORD:change-me}

archive:
  workers: ${ARCHIVE_WORKERS:2}
  upload: ${ARCHIVE_UPLOAD_DIR:data/archive}
  transfers:
    expiry: ${ARCHIVE_TRANSFER_EXPIRY:PT24H}
    cleanup-interval: ${ARCHIVE_TRANSFER_CLEANUP_INTERVAL:3600000}