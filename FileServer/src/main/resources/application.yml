dmp:
  fileserver:
    cors:
      allowed-origins: ${FILESERVER_CORS_ALLOWED_ORIGINS:http://localhost:1420,http://tauri.localhost,https://tauri.localhost,tauri://localhost}
    secret-service:
      url: ${SECRET_SERVICE_URL}
      credential: ${SECRET_SERVICE_CREDENTIAL}
      ca: ${SECRET_SERVICE_CA:}

spring:

  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration

  main:
    web-application-type: reactive

  webflux:
    multipart:
      max-disk-usage-per-part: ${FILESERVER_MULTIPART_MAX_DISK_USAGE_PER_PART:100MB}

  application:
    name: FileServer

archive:
  workers: ${ARCHIVE_WORKERS:2}
  upload: ${ARCHIVE_UPLOAD_DIR:data/archive}
  transfers:
    expiry: ${ARCHIVE_TRANSFER_EXPIRY:PT24H}
    cleanup-interval: ${ARCHIVE_TRANSFER_CLEANUP_INTERVAL:3600000}

metadata:
  database: ${FILESERVER_DATABASE_PATH:data/metadata.db}