services:
  fileserver:
    image: 'ghcr.io/jacklanger/dmp/fileserver:${FILESERVER_IMAGE_TAG:-latest}'
    build:
      context: ..
      dockerfile: FileServer/FileServer.Containerfile
      args:
        VERSION: ${VERSION}
    environment:
      - 'SPRING_SECURITY_USER_PASSWORD=${FILESERVER_PASSWORD:?Set FILESERVER_PASSWORD in FileServer/.env}'
      - 'FILESERVER_MULTIPART_MAX_DISK_USAGE_PER_PART=${FILESERVER_MULTIPART_MAX_DISK_USAGE_PER_PART:-100MB}'
    ports:
      - "8080:8080"
    volumes:
      - "${FILE_SERVER_DATA:-./FileServer/data}:/app/data"