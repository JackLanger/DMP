services:
  fileserver:
    ports: !reset [ ]
    environment:
      - 'SERVER_FORWARD_HEADERS_STRATEGY=framework'

  caddy:
    image: caddy:2
    environment:
      - 'FILESERVER_HTTPS_HOST=${FILESERVER_HTTPS_HOST:?Set FILESERVER_HTTPS_HOST to the Pi IP address or local hostname in FileServer/.env}'
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fileserver

volumes:
  caddy_data:
  caddy_config:

configs:
  caddyfile:
    content: |
      {
        default_sni {$$FILESERVER_HTTPS_HOST}
      }

      https://{$$FILESERVER_HTTPS_HOST} {
        tls internal
        reverse_proxy fileserver:8080
      }
