services:
  secretservice:
    ports: !reset [ ]

  caddy:
    image: caddy:2
    environment:
      - 'FILESERVER_HTTPS_HOST=${FILESERVER_HTTPS_HOST:?Set FILESERVER_HTTPS_HOST to the Pi IP address or local hostname in FileServer/.env}'
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - "${SECRET_SERVICE_CA:?Set SECRET_SERVICE_CA to the CA certificate path}:/run/secrets/secret-service-ca.crt:ro"
    networks:
      - frontend
    depends_on:
      - secretservice

volumes:
  caddy_data:
  caddy_config:

configs:
  caddyfile:
    content: |
      {
        default_sni {$$FILESERVER_HTTPS_HOST}
      }

      https://{$$FILESERVER_HTTPS_HOST} {
        tls internal
        reverse_proxy https://secretservice:8443 {
          transport http {
            tls_trust_pool file /run/secrets/secret-service-ca.crt
          }
        }
      }
